<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Short description: shown by Google under the page title and used by link previews. -->
    <meta name="description" content="CoreWave is a modern, fully responsive landing page for a digital agency offering web development, UI/UX design, SEO and graphic design services." />

    <!-- Colors the browser bar on Android phones to match the page header. -->
    <meta name="theme-color" content="#EEFFF9" />

    <!-- Link preview when the site is shared on WhatsApp, Facebook, LinkedIn, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CoreWave | Web Development & Design Services" />
    <meta property="og:description" content="A modern, fully responsive landing page for a digital agency." />
    <meta property="og:url" content="https://core-wave-saiful.vercel.app/" />

    <!-- Fonts: "preconnect" opens the connection to Google Fonts early, so the font loads faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Only the Lato weights the site really uses (Light 300, Regular 400, Bold 700).
         The old link also loaded Thin, Black and all the italic styles, which were never used. -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <title>corewave by React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
